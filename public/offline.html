<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>Offline | LMCC Prep</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7faf9; color: #0f172a; }
      main { width: min(100%, 430px); padding: 32px; border: 1px solid #dbe4e0; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px rgba(15, 23, 42, .08); }
      .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: #047857; color: white; font-size: 26px; font-weight: 700; }
      h1 { margin: 24px 0 8px; font-size: 26px; letter-spacing: -.03em; }
      p { margin: 0; color: #64748b; line-height: 1.65; }
      button { margin-top: 24px; width: 100%; min-height: 44px; border: 0; border-radius: 12px; background: #047857; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #07110e; color: #f8fafc; } main { background: #121d19; border-color: #263b33; } p { color: #a3b3ac; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">+</div>
      <h1>You are offline</h1>
      <p>Reconnect to continue your LMCC Prep session. Private questions and account data are not stored in the offline page cache.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
